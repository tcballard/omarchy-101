name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: ./tests/run
      - name: Install offscreen Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - run: python3 -m pip install PySide6-Essentials==6.11.2
      - name: Exercise QML lifecycle and atomic storage offscreen
        run: python3 tests/qml/runtime.py
      - name: Package committed candidate and verify checksums
        run: |
          python3 scripts/package.py "$RUNNER_TEMP/101-package"
          cd "$RUNNER_TEMP/101-package"
          sha256sum --check SHA256SUMS
